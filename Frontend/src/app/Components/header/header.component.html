<header
  class="fixed top-0 left-0 right-0 h-[71px] bg-gray-950 text-gray-100 border-b border-gray-700 shadow-sm px-6 flex items-center z-50">
  <div class="flex items-center justify-between w-full">
    <!-- Logo y Rol -->
    <div class="flex items-center space-x-4">
      <a class="flex items-center space-x-2" routerLink="/">
        <span class="logo-icon">
          <img src="AleskyGym.png" alt="Logo" class="w-10 h-10 rounded-full border border-gray-600" width="40" height="40" />
        </span>
        <span class="text-2xl font-semibold tracking-wide text-cyan-400">¡AleskyGym!</span>
      </a>
    </div>

    <!-- Menú de navegación (oculto en móvil) -->
    <nav class="hidden md:flex space-x-6">
      @for (item of menuItems; track item.label) {
      <a class="text-cyan-600 hover:text-white font-medium text-[18px] transition-colors duration-200"
        [routerLink]="item.route" routerLinkActive="text-white font-semibold border-b border-gray-300"
        [routerLinkActiveOptions]="{ exact: false }">
        {{ item.label }}
      </a>
      }
    </nav>

    <!-- Indicador de Demo y enlace al Backend -->
    <div class="flex items-center space-x-3">
      <span class="hidden sm:inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-amber-500/10 text-amber-400 border border-amber-500/30" title="Frontend ejecutándose con datos simulados y persistencia en sesión">
        <span class="w-1.5 h-1.5 mr-1.5 rounded-full bg-amber-400 animate-pulse"></span>
        Demo Front
      </span>

      <a href="https://github.com/edwin71332/Gestion-Clases-Gimnasio/tree/main/Backend"
         target="_blank"
         rel="noopener noreferrer"
         class="inline-flex items-center space-x-2 px-3 py-1.5 rounded-lg text-xs md:text-sm font-medium text-gray-200 bg-gray-800 hover:bg-gray-700 border border-gray-600 hover:border-cyan-500 transition-colors duration-200"
         title="Ver código fuente del Backend (Java Spring Boot + MySQL) en GitHub">
        <svg class="w-4 h-4 fill-current" width="16" height="16" viewBox="0 0 24 24">
          <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
        </svg>
        <span>Ver Backend</span>
      </a>
    </div>
  </div>
</header>
